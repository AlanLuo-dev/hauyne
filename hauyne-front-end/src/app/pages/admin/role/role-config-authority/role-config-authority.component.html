<nz-drawer
        [nzBodyStyle]="{ display: 'flex', 'flex-direction': 'column', height: '100%', padding: '16px' }"
        [nzMaskClosable]="false"
        [nzWidth]="'40%'"
        [(nzVisible)]="configAuthorityFormDialogDisplay"
        [nzTitle]="drawerTitle"
        [nzFooter]="footerTpl"
        (nzOnClose)="handleCancel()"
        [nzKeyboard]="false"
        [nzClosable]="!isCancelDisabled"
>
    <ng-container *nzDrawerContent>
        <nz-spin [nzSpinning]="isLoading" nzTip="加载中..." class="authority-spin-container">
            @if (treeReady) {
                <!-- 顶部固定工具栏 -->
                <div class="authority-toolbar">
                    <!-- 搜索 -->
                    <div class="authority-search">
                        <nz-input-wrapper>
                            <input type="text" nz-input placeholder="搜索权限" [(ngModel)]="searchValue" nzSize="small"/>
                            <nz-icon nzInputSuffix nzType="search" />
                        </nz-input-wrapper>
                    </div>

                    <!-- 父子联动 -->
                    <div class="authority-linkage">
                        <span class="authority-linkage-label">父子联动</span>
                        <nz-switch [(ngModel)]="role!.authorityCheckLinkage!.value"
                                   nzSize="small" [nzControl]="true" (click)="changeCheckStrictly()"
                                   nz-tooltip [nzTooltipTitle]="role!.authorityCheckLinkage!.value ? '已开启' : '已关闭'"
                                   nzTooltipPlacement="top"
                        >
                        </nz-switch>
                    </div>

                    <!-- 树操作 -->
                    <div class="authority-actions">
                        <button
                            type="button"
                            nz-button
                            nzSize="small"
                            (click)="toggleExpandAll()"
                        >
                            <span
                                nz-icon
                                [nzType]="isAllExpanded ? 'minus-square' : 'plus-square'"
                                nzTheme="outline">
                            </span>
                            {{ isAllExpanded ? '收起全部' : '展开全部' }}
                        </button>
                    </div>
                </div>

                <!-- 独立可滚动的树区域 -->
                <div class="authority-tree-wrapper">
                    <nz-tree
                        id="authorityKeys"
                        #nzTreeComponent
                        [nzData]="nodes"
                        nzCheckable
                        [nzCheckedKeys]="defaultCheckedKeys"
                        (nzCheckboxChange)="updateOkDangerStatus()"
                        nzShowIcon
                        [nzSearchValue]="searchValue"
                        (nzSearchValueChange)="nzEvent($event)"
                        [nzCheckStrictly]="!role!.authorityCheckLinkage!.value"
                    >
                    </nz-tree>
                </div>
            }
        </nz-spin>
    </ng-container>

    <!-- 页脚 -->
    <ng-template #footerTpl>
        <div style="float: right">
            <button style="margin-right: 8px;" type="button" nz-button (click)="handleCancel()"
                    [disabled]="isCancelDisabled"
            >
                取消
            </button>

            <button
                    nz-button
                    nzType="primary"
                    [nzDanger]="isOkDanger"
                    [nzLoading]="isOkLoading"
                    (click)="submitAuthorityConfig()"
                    nz-tooltip
                    [nzTooltipTitle]="isOkDanger ? '未勾选权限，将清空该角色所有权限！' : ''"
                    nzTooltipPlacement="right"
            >
                确定
            </button>
        </div>
    </ng-template>
</nz-drawer>
